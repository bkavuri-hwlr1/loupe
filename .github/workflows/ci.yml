name: CI

on:
  push:
    # Release tags run this same matrix through release.yml's workflow_call.
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install bubblewrap for command sandbox tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces, which
          # bubblewrap needs. Tests skip the real sandbox if it cannot start.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: uv sync --locked --all-groups --all-extras
      - run: uv run pytest --cov=llm_cli
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv build --no-sources

  formula:
    # The tap's publish workflow runs `brew style` before installing, so an
    # offense there costs a release attempt. Catch it on the pull request.
    runs-on: macos-15
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.14"
      - name: Check the formula with brew style
        run: |
          brew tap-new --no-git loupe/ci
          formula="$(brew --repo loupe/ci)/Formula/loupe.rb"
          uv run --no-project python scripts/macos_release.py formula --output "$formula"
          brew style loupe/ci/loupe
          # The check must catch a known offense, or it checks nothing.
          offense="$(brew --repo loupe/ci)/Formula/loupe-offense.rb"
          sed -e 's/^class Loupe /class LoupeOffense /' \
            -e 's/formula_opt_bin("git")/Formula["git"].opt_bin/' "$formula" > "$offense"
          if brew style loupe/ci/loupe-offense; then
            echo "brew style did not flag a known formula offense"
            exit 1
          fi
