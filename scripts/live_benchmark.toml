Write a thorough guide, at least 1,500 words, to how one chat prompt travels \
through Loupe: the CLI, the daemon, the coordinator, the agent harness, the \
tool broker, and publication. Use a heading for each component and name the \
source file that implements it."""
min_answer_characters = 7000
min_facts = 0.75
facts = [
