    ["shared_tools.py", "tools.py"],
    ["coordinator.py"],
    ["service.py"],
]

[[tasks]]
id = "cancel-mid-edit"
fixture = "docstrings"
mode = "normal"
prompt = "Add a one-line docstring to every function in src/. Edit one file at a time."
# Stopped after its first edit: the edits made so far are kept for review.
interrupt = "cancel"
state = "cancelled"
edits = "some"

[[tasks]]
id = "crash-mid-edit"
fixture = "docstrings"
mode = "normal"
prompt = "Add a one-line docstring to every function in src/. Edit one file at a time."
# The service is killed after the first edit; the task resumes from its
# checkpoint and finishes without repeating a tool result or the answer.
interrupt = "crash"
state = "reviewing"
outcomes = ["completed"]
edits = "some"

[[tasks]]
id = "independent-review-planted-bug"
min_review_findings = 1
fixture = "review-pagination"
mode = "auto"
prompt = """
Exercise Loupe's independent review gate with a deliberately seeded proposal. \
First read src/pager.py, then replace the page() return statement with exactly \
`return list(items)[start : start + size - 1]`. Keep its validation intact. \
Do not repair that seeded proposal before its first review: run the configured \
smoke check and call finish_task. If the independent review returns findings, \
read the affected code, repair the defect and finish again. Keep the tests \
unchanged. In your final answer explain any review finding and repair.
"""
state = "completed"
outcomes = ["completed"]
edits = "some"
verification = "passed"
facts = [["review"], ["off-by-one", "off by one", "last item", "one fewer"]]

[tasks.checks.smoke]
argv = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider"]
timeout = 120

