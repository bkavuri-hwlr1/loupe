id = "repo-summary"
mode = "normal"
prompt = """
Give me an overview of this repository: what it is for, how it is put \
together, and how someone would start developing on it."""
# An explanation is an answer, not an account of reading files or an edit.
edits = "none"
min_facts = 0.6
