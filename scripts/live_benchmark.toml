# Tasks for scripts/live_benchmark.py. A task runs in a clone of this
# repository at `revision`, or, when it names a `fixture`, in a fresh Git
# repository made from scripts/benchmark_fixtures/FIXTURE.
#
# Each task is scored on what the agent did. Every task must end in `state`
# (default "completed"; a held proposal is "reviewing"), record each tool
# result and answer once, and use one task. Optional expectations:
#   facts / min_facts      wordings the answer must state (any alternative,
#                          ignoring case), and the share of facts needed
#   explore                "never" or "expected" use of explore helpers
#   outcomes               model outcomes allowed (completed, partial, blocked)
#   edits                  "none" or "some" successful edits
#   verification           what the task's checks reported: passed or failed
#   questions / answers    questions the agent must ask, and the replies
#                          given, in order, only when it asks; a question with
#                          no reply left cancels the task
#   min_answer_characters  the shortest acceptable answer
#   max_main_turns         the most model turns a direct answer may take
#   interrupt              "cancel" or "crash" the service after the first edit
#   [tasks.checks.NAME]    checks to configure; "{python}" in argv is this
#                          interpreter, which has pytest
# Bump `version` whenever the tasks, facts, fixtures, or revision change, so
# results from different task sets are not compared.
version = 6
revision = "6e5d65d148d6b4ac92fc849cb4fd861c63f8b5c3"

[[tasks]]
id = "narrow-function"
mode = "plan"
prompt = """
What does the _display function in src/llm_cli/agent/explorer.py do? One short \
paragraph."""
# A one-function question should be answered with direct reads.
explore = "never"
facts = [
    ["whitespace", "single line", "one line", "spaces"],
    ["200"],
    ["…", "ellipsis"],
]

[[tasks]]
id = "three-questions"
mode = "plan"
prompt = """
Before a refactor I need three independent answers: (1) how each provider \
adapter (anthropic, openai, codex) detects and reports a context-window \
overflow; (2) how the daemon recovers in-flight tasks after a restart; (3) how \
the terminal UI decides what text goes on the activity line. Give a concise \
summary for each."""
explore = "expected"
min_facts = 0.8
facts = [
    ["413"],
    ["context_length_exceeded"],
    ["model_context_window_exceeded"],
    ["response.failed"],
    ["context_overflow"],
    ["checkpoint"],
    ["DAEMON_INTERRUPTED", "failed_safe", "operator_attention"],
    ["EventRenderer"],
    ["Thinking"],
    ["Writing the answer", "answer preview"],
]

[[tasks]]
id = "trace-shared-edit"
mode = "plan"
prompt = """
Trace the full path of a file edit in a shared-workspace task, from the \
model's write_file tool call until the change is published to the checkout on \
disk. Name the components and functions involved, and explain where the edit \
can be held, rejected, or rolled back."""
explore = "expected"
min_facts = 0.8
facts = [
    ["_write_file"],
    ["_stage"],
    ["os.replace"],
    ["SharedBatchPublisher"],
    ["reserve_shared_publication"],
    ["settle_shared_execution"],
    ["retain"],
    ["operator_attention"],
    ["CheckRunner"],
    ["restore_usage"],
    ["atomic_replace"],
]

