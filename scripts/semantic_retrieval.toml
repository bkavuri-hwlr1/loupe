# Questions and gate are frozen before the first embedding rank is computed.
version = 1
model_id = "sentence-transformers/all-MiniLM-L6-v2"
model_revision = "1110a243fdf4706b3f48f1d95db1a4f5529b4d41"
max_wordpieces = 256
file_result_limit = 20
chunk_candidate_pool = 80
rrf_constant = 60

[model_files]
"tokenizer.json" = { bytes = 466247, git_blob = "cb202bfe2e3c98645018a6d12f182a434c9d3e02" }
"onnx/model.onnx" = { bytes = 90405214, sha256 = "6fd5d72fe4589f189f8ebc006442dbb529bb7ce38f8082112682524616046452" }

[gate]
minimum_queries_per_repository = 30
minimum_macro_delta_at_10 = 0.10
minimum_repository_delta_at_10 = 0.05
bootstrap_seed = 20261030
bootstrap_samples = 10000

[repositories.loupe]
url = "https://github.com/bkavuri-hwlr1/loupe"
revision = "69b8bcfcdf5091dc3f76674cd93318ae6fa86213"
prefix = "src/llm_cli/"

[repositories.django]
url = "https://github.com/django/django"
revision = "f4c65fd6a517dd32bd2e732ae3543e550e56f206"
prefix = "django/"


