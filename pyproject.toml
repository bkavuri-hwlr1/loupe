[project]
name = "llm-coord"
version = "0.1.0a0"
description = "Magnifio: a terminal coding agent with cross-session coordination"
readme = "packaging/README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "rich>=14.1,<15",
    "prompt-toolkit>=3.0.52,<4",
]

[project.scripts]
magnifio = "llm_cli.cli.app:main"
magnifiod = "llm_cli.daemon.main:main"
llm-coord = "llm_cli.cli.app:main"
llm-coordd = "llm_cli.daemon.main:main"

[project.optional-dependencies]
anthropic = [
    "anthropic>=0.40",
]
openai = [
    "openai>=2.0",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "llm_cli"
source-exclude = [
  ".coverage",
  ".hypothesis",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  ".smoke",
  ".uv-cache",
  ".venv",
  "build",
  "dist",
]

[dependency-groups]
dev = [
  "hypothesis>=6.135,<7",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6.1,<7",
  "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --cov-config=pyproject.toml"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["llm_cli"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["llm_cli"]
